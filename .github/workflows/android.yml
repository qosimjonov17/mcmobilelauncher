name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi: Android ABI nomi, arch: Java release'laridagi nom
          - { abi: arm64-v8a,   arch: arm64,  name: arm64 }
          - { abi: armeabi-v7a, arch: arm,    name: armv7 }
          - { abi: x86_64,      arch: x86_64, name: x86_64 }
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Java 8, 17 va 21 APK ichiga joylanadi, shuning uchun oʻyin ishga tushganda
      # Java GitHub'dan yuklab olinmaydi (sekin tarmoqlarda bu xatoga olib kelardi).
      - name: Bundle Java runtimes
        run: |
          A=app_pojavlauncher/src/main/assets/components
          python3 scripts/bundle_jre.py 8  $A/jre    ${{ matrix.arch }}
          python3 scripts/bundle_jre.py 17 $A/jre-new ${{ matrix.arch }}
          python3 scripts/bundle_jre.py 21 $A/jre-21  ${{ matrix.arch }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug -PtargetAbi=${{ matrix.abi }}
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/mayoq-${{ matrix.name }}.apk
          md5sum out/mayoq-${{ matrix.name }}.apk > out/mayoq-${{ matrix.name }}.md5

      # Release APK faqat imzolash kaliti (GPLAY_KEYSTORE_PASSWORD secret) sozlanganda yigʻiladi.
      - name: Build Release .apk
        if: env.GPLAY_KEYSTORE_PASSWORD != ''
        run: |
          gradle :app_pojavlauncher:assembleRelease -PtargetAbi=${{ matrix.abi }}
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/mayoq-${{ matrix.name }}-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mayoq-${{ matrix.name }}
          path: out/*

  # Telefondan oson yuklab olish uchun: APK'lar "Releases" sahifasiga toʻgʻridan-toʻgʻri qoʻyiladi.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Eski build fayllari (masalan, oldingi nomdagi APK'lar) sahifada qolib ketmasligi uchun
      - name: Remove old APKs from "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
            | while read -r name; do gh release delete-asset latest "$name" --repo "$GITHUB_REPOSITORY" -y; done

      - name: Publish APKs to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mayoq Launcher (soʻnggi build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Soʻnggi avtomatik build: ${{ github.sha }}

            Qaysi faylni yuklab olish kerak:
            - **mayoq-arm64.apk** — deyarli barcha zamonaviy telefonlar (shuni tanlang)
            - **mayoq-armv7.apk** — juda eski 32-bitli telefonlar
            - **mayoq-x86_64.apk** — kompyuterdagi emulyatorlar (LDPlayer, BlueStacks, Android Studio)
          files: out/*.apk
